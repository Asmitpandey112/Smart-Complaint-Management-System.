<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Complaint Management – Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@^3/dist/tailwind.min.js"></script>
  <style>
    .loader { @apply animate-spin border-4 border-blue-500 border-t-transparent rounded-full w-8 h-8; }
  </style>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <!-- Header -->
  <header class="bg-white shadow p-4 flex items-center justify-between">
    <h1 class="text-2xl font-bold">Smart Resolve AI</h1>
    <button id="theme-toggle" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200">🌙</button>
  </header>

  <!-- Main -->
  <main class="flex-1 container mx-auto p-4 space-y-6">
    <!-- KPI cards -->
    <section class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-xs text-gray-500 uppercase">Total Tickets</p>
        <p class="text-2xl font-bold" id="kpi-total">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-xs text-gray-500 uppercase">Pending</p>
        <p class="text-2xl font-bold text-blue-600" id="kpi-pending">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-xs text-gray-500 uppercase">In‑Progress</p>
        <p class="text-2xl font-bold text-amber-600" id="kpi-progress">0</p>
      </div>
      <div class="bg-white p-4 rounded-xl shadow">
        <p class="text-xs text-gray-500 uppercase">Resolved</p>
        <p class="text-2xl font-bold text-emerald-600" id="kpi-resolved">0</p>
      </div>
    </section>

    <!-- Kanban board -->
    <section class="grid grid-cols-1 md:grid-cols-4 gap-4">
      <div class="bg-gray-100 p-3 rounded-xl min-h-[400px]" id="col-pending">
        <h2 class="font-semibold text-sm mb-2">📋 Pending</h2>
        <div id="kanban-pending" class="space-y-2"></div>
      </div>
      <div class="bg-gray-100 p-3 rounded-xl min-h-[400px]" id="col-inprogress">
        <h2 class="font-semibold text-sm mb-2">🔧 In Progress</h2>
        <div id="kanban-inprogress" class="space-y-2"></div>
      </div>
      <div class="bg-gray-100 p-3 rounded-xl min-h-[400px]" id="col-escalated">
        <h2 class="font-semibold text-sm mb-2">🚨 Escalated</h2>
        <div id="kanban-escalated" class="space-y-2"></div>
      </div>
      <div class="bg-gray-100 p-3 rounded-xl min-h-[400px]" id="col-resolved">
        <h2 class="font-semibold text-sm mb-2">✅ Resolved</h2>
        <div id="kanban-resolved" class="space-y-2"></div>
      </div>
    </section>

    <!-- New complaint modal (simple) -->
    <section class="bg-white p-4 rounded-xl shadow">
      <h2 class="text-xl font-semibold mb-2">File a New Complaint</h2>
      <form id="new-complaint" class="grid gap-2">
        <input type="text" id="new-title" placeholder="Title" required class="border rounded p-2" />
        <textarea id="new-desc" placeholder="Description" required class="border rounded p-2"></textarea>
        <input type="text" id="new-location" placeholder="Location" required class="border rounded p-2" />
        <button type="submit" class="bg-blue-600 text-white py-2 rounded">Submit</button>
      </form>
    </section>
  </main>

  <script>
    // ---------- Theme toggle ----------
    const toggleBtn = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') document.documentElement.classList.add('dark');
    toggleBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    toggleBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      toggleBtn.textContent = isDark ? '☀️' : '🌙';
    });

    const API = 'http://localhost:3000/api';
    // ---------- Load tickets ----------
    async function loadTickets() {
      const res = await fetch(`${API}/complaints`);
      const data = await res.json();
      if (!data.success) return;
      const tickets = data.data;
      // Update KPI counters
      document.getElementById('kpi-total').innerText = tickets.length;
      document.getElementById('kpi-pending').innerText = tickets.filter(t=>t.status==='Pending').length;
      document.getElementById('kpi-progress').innerText = tickets.filter(t=>t.status==='In Progress').length;
      document.getElementById('kpi-resolved').innerText = tickets.filter(t=>t.status==='Resolved').length;
      // Clear columns
      ['pending','inprogress','escalated','resolved'].forEach(col=>{
        document.getElementById(`kanban-${col}`).innerHTML='';
      });
      // Render cards
      tickets.forEach(t=>{
        const card = document.createElement('div');
        card.className = 'bg-white p-2 rounded border cursor-grab shadow-sm';
        card.draggable = true;
        card.dataset.id = t.id;
        card.innerHTML = `
          <strong>${t.title}</strong><br/>
          <small class='text-gray-500'>${t.location}</small>
        `;
        card.addEventListener('dragstart', e=>{e.dataTransfer.setData('text/plain', t.id);});
        // Append to correct column
        const colMap = {
          'Pending':'pending',
          'In Progress':'inprogress',
          'Escalated':'escalated',
          'Resolved':'resolved'
        };
        const target = document.getElementById(`kanban-${colMap[t.status]}`);
        if (target) target.appendChild(card);
      });
    }

    // ---------- Drop handlers for columns ----------
    ['pending','inprogress','escalated','resolved'].forEach(col=>{
      const dropArea = document.getElementById(`col-${col}`);
      dropArea.addEventListener('dragover', e=>{e.preventDefault(); dropArea.classList.add('bg-blue-100');});
      dropArea.addEventListener('dragleave', ()=>{dropArea.classList.remove('bg-blue-100');});
      dropArea.addEventListener('drop', async e=>{
        e.preventDefault(); dropArea.classList.remove('bg-blue-100');
        const id = e.dataTransfer.getData('text/plain');
        const statusMap = {pending:'Pending',inprogress:'In Progress',escalated:'Escalated',resolved:'Resolved'};
        const newStatus = statusMap[col];
        const res = await fetch(`${API}/complaints/${id}`,{
          method:'PATCH',
          headers:{'Content-Type':'application/json'},
          body:JSON.stringify({status:newStatus, note:`Moved via UI to ${newStatus}`})
        });
        const json = await res.json();
        if (json.success) loadTickets();
      });
    });

    // ---------- New complaint submission ----------
    document.getElementById('new-complaint').addEventListener('submit', async e=>{
      e.preventDefault();
      const payload = {
        title: document.getElementById('new-title').value,
        description: document.getElementById('new-desc').value,
        location: document.getElementById('new-location').value,
        categoryOverride:'', imageUrl:'', phone:''
      };
      const res = await fetch(`${API}/complaints`,{
        method:'POST',
        headers:{'Content-Type':'application/json'},
        body:JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success){
        alert('Complaint created');
        e.target.reset();
        loadTickets();
      } else {
        alert('Error: '+(json.message||'Failed'));
      }
    });

    // Initial load
    loadTickets();
  </script>
</body>
</html>
