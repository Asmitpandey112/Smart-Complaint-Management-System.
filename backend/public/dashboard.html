<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Smart Complaint Management System</title>
  <script src="https://cdn.jsdelivr.net/npm/tailwindcss@^3/dist/tailwind.min.js"></script>
  <style>
    .loader { @apply animate-spin border-4 border-blue-500 border-t-transparent rounded-full w-8 h-8; }
    .card { @apply bg-white p-4 rounded-lg shadow-sm transition-transform duration-200 hover:shadow-lg hover:scale-105 cursor-pointer; }
    .tooltip {
      @apply absolute bg-gray-800 text-white text-xs rounded py-1 px-2 shadow-lg pointer-events-none opacity-0 transition-opacity duration-150;
    }
  </style>
  <div id="tooltip" class="tooltip"></div>
</head>
<body class="bg-gray-50 text-gray-900 min-h-screen flex flex-col">
  <!-- Header with dark‑mode toggle -->
  <header class="flex justify-between items-center p-4 bg-white shadow">
    <h1 class="text-2xl font-bold">Smart Resolve AI</h1>
    <button id="theme-toggle" class="px-3 py-1 rounded bg-gray-200 dark:bg-gray-700 text-gray-800 dark:text-gray-200">🌙</button>
  </header>

  <!-- Main container -->
  <main class="flex-1 container mx-auto p-4" id="app">
    <!-- Login panel (initial) -->
    <section id="login-section" class="max-w-md mx-auto bg-white p-6 rounded-xl shadow-md">
      <h2 class="text-xl font-semibold mb-4 text-center">Login</h2>
      <form id="login-form" class="space-y-3">
        <input type="text" id="login-name" placeholder="Name" required class="w-full border rounded p-2" />
        <select id="login-role" required class="w-full border rounded p-2">
          <option value="" disabled selected>Select Role</option>
          <option value="user">Citizen (User)</option>
          <option value="admin">Admin</option>
          <option value="staff">Staff</option>
        </select>
        <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded">Enter</button>
      </form>
    </section>

    <!-- Role‑specific panels – hidden initially -->
    <section id="user-panel" class="hidden">
      <h2 class="text-2xl font-semibold mb-4">File a Complaint</h2>
      <form id="user-complaint-form" class="grid gap-2 max-w-2xl">
        <input type="text" id="u-title" placeholder="Title" required class="border rounded p-2" />
        <textarea id="u-desc" placeholder="Description" required class="border rounded p-2"></textarea>
        <input type="text" id="u-location" placeholder="Location" required class="border rounded p-2" />
        <button type="submit" class="bg-blue-600 text-white py-2 rounded">Submit Complaint</button>
      </form>
      <hr class="my-6" />
      <h3 class="text-xl font-semibold mb-2">My Complaints</h3>
      <div id="my-complaints" class="space-y-3"></div>
    </section>

    <section id="admin-panel" class="hidden">
      <h2 class="text-2xl font-semibold mb-4">All Complaints (Admin)</h2>
      <div id="admin-complaints" class="space-y-3"></div>
    </section>

    <section id="staff-panel" class="hidden">
      <h2 class="text-2xl font-semibold mb-4">My Assigned Tasks</h2>
      <div id="staff-tasks" class="space-y-3"></div>
    </section>
  </main>

  <script>
    // ---------- Theme ----------
    const themeBtn = document.getElementById('theme-toggle');
    const saved = localStorage.getItem('theme');
    if (saved === 'dark') document.documentElement.classList.add('dark');
    themeBtn.textContent = document.documentElement.classList.contains('dark') ? '☀️' : '🌙';
    themeBtn.addEventListener('click', () => {
      document.documentElement.classList.toggle('dark');
      const isDark = document.documentElement.classList.contains('dark');
      localStorage.setItem('theme', isDark ? 'dark' : 'light');
      themeBtn.textContent = isDark ? '☀️' : '🌙';
    });

    const API = 'http://localhost:3000/api';
    let currentUser = { name: '', role: '' };

    // ---------- Login ----------
    const loginSection = document.getElementById('login-section');
    const loginForm = document.getElementById('login-form');
    loginForm.addEventListener('submit', e => {
      e.preventDefault();
      const name = document.getElementById('login-name').value.trim();
      const role = document.getElementById('login-role').value;
      if (!name || !role) return;
      currentUser = { name, role };
      loginSection.classList.add('hidden');
      showPanel(role);
    });

    function showPanel(role) {
      document.getElementById('user-panel').classList.add('hidden');
      document.getElementById('admin-panel').classList.add('hidden');
      document.getElementById('staff-panel').classList.add('hidden');
      if (role === 'user') document.getElementById('user-panel').classList.remove('hidden');
      else if (role === 'admin') document.getElementById('admin-panel').classList.remove('hidden');
      else if (role === 'staff') document.getElementById('staff-panel').classList.remove('hidden');
      loadData();
    }

    // ---------- Helper to create card ----------
    const createCard = (data, actions = []) => {
      const card = document.createElement('div');
      card.className = 'card'; // use enhanced styling
      card.dataset.id = data.id;
      card.dataset.status = data.status;
      card.innerHTML = `
        <h4 class="font-bold">${data.title}</h4>
        <p class="text-sm text-gray-600">${data.description}</p>
        <p class="text-xs text-gray-500">Location: ${data.location}</p>
        <p class="text-xs">Status: <span class="font-medium">${data.status}</span></p>
      `;
      // tooltip handling on mouse events
      card.addEventListener('mouseenter', e => {
        const tooltip = document.getElementById('tooltip');
        tooltip.textContent = `ID: ${data.id} | Status: ${data.status}`;
        tooltip.style.opacity = '1';
      });
      card.addEventListener('mouseleave', e => {
        const tooltip = document.getElementById('tooltip');
        tooltip.style.opacity = '0';
      });
      card.addEventListener('mousemove', e => {
        const tooltip = document.getElementById('tooltip');
        const offset = 12;
        tooltip.style.left = (e.pageX + offset) + 'px';
        tooltip.style.top = (e.pageY + offset) + 'px';
      });
      actions.forEach(act => {
        const btn = document.createElement('button');
        btn.textContent = act.label;
        btn.className = 'text-sm bg-blue-500 hover:bg-blue-600 text-white py-1 px-2 rounded';
        btn.addEventListener('click', act.handler);
        card.appendChild(btn);
      });
      return card;
    };

    // ---------- Load Data based on role ----------
    async function loadData() {
      if (currentUser.role === 'user') loadUserComplaints();
      else if (currentUser.role === 'admin') loadAdminComplaints();
      else if (currentUser.role === 'staff') loadStaffTasks();
    }

    // ----- User -----
    async function loadUserComplaints() {
      const container = document.getElementById('my-complaints');
      container.innerHTML = '<div class="loader mx-auto"></div>';
      const res = await fetch(`${API}/complaints?reporter=${encodeURIComponent(currentUser.name)}`);
      const json = await res.json();
      if (!json.success) { container.innerHTML = '<p class="text-red-500">Failed to load.</p>'; return; }
      const list = json.data;
      container.innerHTML = '';
      if (list.length === 0) container.innerHTML = '<p class="text-gray-600">No complaints yet.</p>';
      else list.forEach(c => {
        const card = createCard(c, [{label: 'Track', handler: () => openTracking(c.id)}]);
        container.appendChild(card);
      });
    }

    // ----- Admin -----
    async function loadAdminComplaints() {
      const container = document.getElementById('admin-complaints');
      container.innerHTML = '<div class="loader mx-auto"></div>';
      const res = await fetch(`${API}/complaints`);
      const json = await res.json();
      if (!json.success) { container.innerHTML = '<p class="text-red-500">Failed to load.</p>'; return; }
      const list = json.data;
      container.innerHTML = '';
      list.forEach(c => {
        const actions = [
          {label: 'Assign Staff', handler: () => assignStaff(c.id)},
          {label: 'Update Status', handler: () => updateStatus(c.id)}
        ];
        const card = createCard(c, actions);
        container.appendChild(card);
      });
    }

    // ----- Staff -----
    async function loadStaffTasks() {
      const container = document.getElementById('staff-tasks');
      container.innerHTML = '<div class="loader mx-auto"></div>';
      const res = await fetch(`${API}/complaints?staff=${encodeURIComponent(currentUser.name)}`);
      const json = await res.json();
      if (!json.success) { container.innerHTML = '<p class="text-red-500">Failed to load.</p>'; return; }
      const list = json.data;
      container.innerHTML = '';
      list.forEach(c => {
        const actions = [{label: 'Update Status', handler: () => updateStatus(c.id)}];
        const card = createCard(c, actions);
        container.appendChild(card);
      });
    }

    // ---------- User actions ----------
    document.getElementById('user-complaint-form').addEventListener('submit', async e => {
      e.preventDefault();
      const payload = {
        title: document.getElementById('u-title').value,
        description: document.getElementById('u-desc').value,
        location: document.getElementById('u-location').value,
        categoryOverride: '',
        imageUrl: '',
        phone: ''
      };
      const res = await fetch(`${API}/complaints`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload)
      });
      const json = await res.json();
      if (json.success) {
        alert('Complaint filed');
        e.target.reset();
        loadUserComplaints();
      } else {
        alert('Error: ' + (json.message || 'Failed'));
      }
    });

    // ---------- Admin actions ----------
    async function assignStaff(id) {
      const staff = prompt('Enter staff name to assign:');
      if (!staff) return;
      await patchComplaint(id, { assignedStaff: staff, note: `Assigned to ${staff}` });
      loadAdminComplaints();
    }
    async function updateStatus(id) {
      const status = prompt('Enter new status (Pending, In Progress, Escalated, Resolved):');
      if (!status) return;
      await patchComplaint(id, { status, note: `Status changed to ${status}` });
      loadData();
    }
    async function patchComplaint(id, data) {
      const res = await fetch(`${API}/complaints/${id}`, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      const json = await res.json();
      if (!json.success) alert('Update failed: ' + (json.message || '')); 
    }

    // ---------- Tracking view ----------
    async function openTracking(id) {
      const res = await fetch(`${API}/complaints/${id}`);
      const json = await res.json();
      if (!json.success) { alert('Failed to fetch'); return; }
      const t = json.data;
      alert(`Tracking ID: ${t.id}\nStatus: ${t.status}\nLocation: ${t.location}\nCreated: ${t.createdAt}`);
    }

    // ---------- Feedback (after resolved) ----------
    // For brevity, feedback can be entered via browser prompt when status becomes Resolved.
  </script>
</body>
</html>
